metadata:
  name: pth-custom-window-seg
  namespace: cvat
  annotations:
    name: Window Segmentation + Classification
    type: detector
    spec: |
      [
        { "id": 1, "name": "Aluminium", "type": "mask" },
        { "id": 2, "name": "Bauschutt", "type": "mask" },
        { "id": 3, "name": "Beton", "type": "mask" },
        { "id": 4, "name": "Erde", "type": "mask" },
        { "id": 5, "name": "Feuerfest Zement", "type": "mask" },
        { "id": 6, "name": "Filterkerzenbruch", "type": "mask" },
        { "id": 7, "name": "Glas", "type": "mask" },
        { "id": 8, "name": "Kalk", "type": "mask" },
        { "id": 9, "name": "Keramik", "type": "mask" },
        { "id": 10, "name": "Metall", "type": "mask" },
        { "id": 11, "name": "Metall Eisen", "type": "mask" },
        { "id": 12, "name": "Mineralwolle", "type": "mask" },
        { "id": 13, "name": "Schamott", "type": "mask" },
        { "id": 14, "name": "Schlamm", "type": "mask" },
        { "id": 15, "name": "Schotter/Sand", "type": "mask" }
      ]

spec:
  description: DeepLabV3-ResNet50 window segmentation with ResNet18 window classification (GPU)
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s

  build:
    image: cvat.pth.custom.window_seg:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: |-
            apt-get update \
            && apt-get install -y --no-install-recommends \
              python3 python3-pip python-is-python3 \
              libglib2.0-0 libgl1-mesa-glx \
            && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: |-
            pip install --no-cache-dir \
              torch torchvision
        - kind: RUN
          value: |-
            pip install --no-cache-dir \
              numpy Pillow scikit-image opencv-python-headless

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
